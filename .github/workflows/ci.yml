name: CI

on:
  push:
    branches: [r99_app]
  pull_request:
    branches: [r99_app]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            project_tool/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', 'project_tool/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install app dependencies
        run: flutter pub get

      - name: Install project_tool dependencies
        run: dart pub get
        working-directory: project_tool

      - name: Generate barrel files (_.dart)
        run: ./ff auto-export

      - name: Generate Isar files (*.g.dart)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            project_tool/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', 'project_tool/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install app dependencies
        run: flutter pub get

      - name: Install project_tool dependencies
        run: dart pub get
        working-directory: project_tool

      - name: Generate barrel files (_.dart)
        run: ./ff auto-export

      - name: Generate Isar files (*.g.dart)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (debug)
        run: flutter build apk --debug --flavor dev -t lib/main_development.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7

  build-ios:
    name: Build iOS (no-codesign)
    runs-on: macos-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            project_tool/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', 'project_tool/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install app dependencies
        run: flutter pub get

      - name: Install project_tool dependencies
        run: dart pub get
        working-directory: project_tool

      - name: Generate barrel files (_.dart)
        run: ./ff auto-export

      - name: Generate Isar files (*.g.dart)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign --flavor dev -t lib/main_development.dart