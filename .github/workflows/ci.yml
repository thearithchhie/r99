name: CI

on:
  push:
    branches: [r99_app]
  pull_request:
    branches: [r99_app]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            project_tool/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', 'project_tool/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Create .env from secrets
        run: |
          cp .env.example .env
          echo "GOOGLE_SHEET_LINK=${{ secrets.GOOGLE_SHEET_LINK }}" >> .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Install app dependencies
        run: flutter pub get

      - name: Install project_tool dependencies
        run: dart pub get
        working-directory: project_tool

      - name: Generate barrel files (_.dart)
        run: ./ff auto-export

      - name: Generate Isar files (*.g.dart)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test
        run: flutter test
