spring:
  application:
    name: r99-shop-api
  datasource:
    url: jdbc:postgresql://localhost:5432/r99_shop_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  data:
    web:
      pageable:
        one-indexed-parameters: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

